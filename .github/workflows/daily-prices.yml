name: Refresh company metadata

# Weekly (and on every portfolio upload): refreshes company names, sectors and countries
# from the public nasdaq.com screener into data/prices.json. When the portfolio comes from
# an IBKR import, positions/prices/P&L are IBKR's own and are not touched. No secrets needed.
on:
  schedule:
    - cron: "30 22 * * 0"
  push:
    branches: [main]
    paths: ["portfolio/**"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-prices
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Fetch prices and record today's snapshot
        run: node scripts/update-prices.mjs

      - name: Commit changes
        run: |
          git config user.name "asf-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data portfolio
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Daily prices $(date -u +%Y-%m-%d)"
            git push
          fi
