// ── DAILY EVOLUTION CHART ────────────────────────────────────────────────────
const DAILY_DATA = [
  {label:"Jan",value:191},{label:"Feb",value:284},{label:"Mar",value:412},
  {label:"Apr",value:538},{label:"May",value:631},{label:"Jun",value:720},
  {label:"Jul",value:865},{label:"Aug",value:974},{label:"Sep",value:1102},
  {label:"Oct",value:1287},{label:"Nov",value:1456},{label:"Dec",value:1618},
  {label:"Jan",value:1743},{label:"Feb",value:1892},{label:"Mar",value:2058},
  {label:"Apr",value:2184},{label:"May",value:2291},{label:"Jun",value:2518},
];

function DailyChart() {
  const [hov, setHov] = useState(null);
  const W=398, H=90, PT=8, PB=22, PL=2, PR=2;
  const iW=W-PL-PR, iH=H-PT-PB;
  const vals = DAILY_DATA.map(d=>d.value);
  const minV=Math.min(...vals), maxV=Math.max(...vals);
  const range=maxV-minV||1;
  const pts = DAILY_DATA.map((d,i)=>({
    x: PL + (i/(DAILY_DATA.length-1))*iW,
    y: PT + iH - ((d.value-minV)/range)*iH,
    d,
  }));
  const linePath = pts.map((p,i)=>`${i===0?"M":"L"}${p.x.toFixed(1)},${p.y.toFixed(1)}`).join(" ");
  const areaPath = linePath+` L${pts[pts.length-1].x},${PT+iH} L${pts[0].x},${PT+iH} Z`;

  return (
    <div style={{marginBottom:10,background:C.card,borderRadius:12,padding:"10px 8px 2px",border:`1px solid ${C.border}`,boxShadow:"0 1px 8px #0D1E350A"}}>
      <div style={{paddingLeft:4,marginBottom:6}}>
        <span style={{color:C.text,fontSize:11,fontWeight:600}}>Fund Growth</span>
      </div>
      <svg width="100%" viewBox={`0 0 ${W} ${H}`} style={{overflow:"visible",display:"block"}}>
        <defs>
          <linearGradient id="dcg" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stopColor={C.accent} stopOpacity="0.18"/>
            <stop offset="100%" stopColor={C.accent} stopOpacity="0"/>
          </linearGradient>
        </defs>
        <path d={areaPath} fill="url(#dcg)"/>
        <path d={linePath} fill="none" stroke={C.accent} strokeWidth={2} strokeLinejoin="round"/>
        {pts.map((p,i)=>(
          <g key={i} onMouseEnter={()=>setHov(i)} onMouseLeave={()=>setHov(null)}>
            <circle cx={p.x} cy={p.y} r={hov===i?4:2.5}
              fill={hov===i?C.accent:C.bg}
              stroke={C.accent} strokeWidth={1.5}
              style={{cursor:"pointer",transition:"r 0.1s"}}/>
            {i%3===0&&<text x={p.x} y={H-5} textAnchor="middle" fontSize={7.5} fill={C.muted}>{p.d.label}</text>}
            {hov===i&&(
              <g>
                <rect x={p.x-22} y={p.y-22} width={44} height={16} rx={4} fill={C.accent}/>
                <text x={p.x} y={p.y-11} textAnchor="middle" fontSize={9} fill="#fff" fontWeight="700">${p.d.value.toLocaleString()}</text>
              </g>
            )}
          </g>
        ))}
      </svg>
    </div>
  );
}

// ── ADMIN TAB ─────────────────────────────────────────────────────────────────
function AdminTab({ stats, setStats, stocks, setStocks }) {
  const cs = "0 2px 12px #0D1E3510";
  const [msg, setMsg] = useState("");
  const [msgType, setMsgType] = useState("ok");
  const [csvText, setCsvText] = useState("");
  const [editStats, setEditStats] = useState({...stats});
  const fileRef = useRef(null);

  const showMsg = (text, type="ok") => {
    setMsg(text);
    setMsgType(type);
    setTimeout(() => setMsg(""), 3500);
  };

  // Parse uploaded CSV/Excel-exported CSV
  const handleFile = (e) => {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = (ev) => {
      try {
        const text = ev.target.result;
        const lines = text.trim().split(/\r?\n/).filter(l => l.trim());
        // Detect if first line is header
        const firstCols = lines[0].split(/[,;\t]/);
        const hasHeader = isNaN(parseFloat(firstCols[0])) || firstCols[0].toLowerCase().includes("no") || firstCols[0].toLowerCase().includes("symbol") || firstCols[0].toLowerCase().includes("#");
        const dataLines = hasHeader ? lines.slice(1) : lines;
        
        let added = 0, skipped = 0;
        const existingTickers = new Set(stocks.map(s => s.t.toUpperCase()));
        const newStocks = [...stocks];

        dataLines.forEach(line => {
          const cols = line.split(/[,;\t]/).map(c => c.trim().replace(/"/g,""));
          // Expected columns (flexible): ticker, exchange, price, qty, invested, div
          // Or: №, ticker, exchange, price, qty, invested, div, divYield
          let ticker, exchange, price, qty, invested, div;
          
          if (cols.length >= 7 && !isNaN(parseFloat(cols[0]))) {
            // Format with row number: №, ticker, exchange, price, qty, invested, div
            [, ticker, exchange, price, qty, invested, div] = cols;
          } else if (cols.length >= 6) {
            // Format: ticker, exchange, price, qty, invested, div
            [ticker, exchange, price, qty, invested, div] = cols;
          } else if (cols.length >= 2) {
            ticker = cols[0];
            exchange = cols[1] || "NYSE";
            price = cols[2] || 0;
            qty = cols[3] || 0.01;
            invested = cols[4] || 1;
            div = cols[5] || 0;
          } else return;

          ticker = (ticker || "").toUpperCase().trim();
          if (!ticker || ticker.length > 8) return;
          
          const p = parseFloat(price) || 0;
          const q = parseFloat(qty) || 0.01;
          const i = parseFloat(invested) || 1;
          const d = parseFloat(div) || 0;
          const ex = (exchange || "NYSE").toUpperCase().trim();

          if (existingTickers.has(ticker)) {
            // Update existing
            const idx = newStocks.findIndex(s => s.t.toUpperCase() === ticker);
            if (idx >= 0) {
              newStocks[idx] = { t: ticker, ex, p: Math.round(p*10000)/10000, q: Math.round(q*1000000)/1000000, i: Math.round(i*100)/100, d: Math.round(d*100)/100 };
              added++;
            }
          } else {
            newStocks.push({ t: ticker, ex, p: Math.round(p*10000)/10000, q: Math.round(q*1000000)/1000000, i: Math.round(i*100)/100, d: Math.round(d*100)/100 });
            existingTickers.add(ticker);
            added++;
          }
        });

        newStocks.sort((a,b) => a.t.localeCompare(b.t));
        setStocks(newStocks);
        localStorage.setItem("asf_stocks", JSON.stringify(newStocks));
        showMsg(`✓ ${added} stocks added/updated. Total: ${newStocks.length}`);
      } catch(err) {
        showMsg("✗ Could not parse file. Use CSV format.", "err");
      }
    };
    reader.readAsText(file);
    e.target.value = "";
  };

  const saveStats = () => {
    const s = {
      nCompanies: parseInt(editStats.nCompanies) || stats.nCompanies,
      invested:   parseFloat(editStats.invested)  || stats.invested,
      value:      parseFloat(editStats.value)      || stats.value,
      profit:     parseFloat(editStats.profit)     || stats.profit,
      gainPct:    parseFloat(editStats.gainPct)    || stats.gainPct,
      dividends:  parseFloat(editStats.dividends)  || stats.dividends,
    };
    setStats(s);
    localStorage.setItem("asf_stats", JSON.stringify(s));
    showMsg("✓ Stats saved successfully!");
  };

  const exportCSV = () => {
    const header = "Ticker,Exchange,Price,Quantity,Invested,Dividend\n";
    const rows = stocks.map(s => `${s.t},${s.ex},${s.p},${s.q},${s.i},${s.d}`).join("\n");
    const blob = new Blob([header + rows], {type:"text/csv"});
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url; a.download = "allstockfund_portfolio.csv"; a.click();
    URL.revokeObjectURL(url);
    showMsg("✓ CSV exported!");
  };

  const resetToDefault = () => {
    if (!window.confirm("Reset all data to original? This cannot be undone.")) return;
    localStorage.removeItem("asf_stocks");
    localStorage.removeItem("asf_stats");
    window.location.reload();
  };

  const fields = [
    { key:"nCompanies", label:"Number of Stocks",  suffix:"",  type:"number" },
    { key:"invested",   label:"Total Invested ($)", suffix:"$", type:"number" },
    { key:"value",      label:"Portfolio Value ($)", suffix:"$", type:"number" },
    { key:"profit",     label:"Profit ($)",          suffix:"$", type:"number" },
    { key:"gainPct",    label:"Gain (%)",            suffix:"%", type:"number" },
    { key:"dividends",  label:"Dividends ($)",       suffix:"$", type:"number" },
  ];

  return (
    <div style={{padding:"0 16px 100px"}}>
      <div style={{marginBottom:20}}>
        <div style={{color:C.text,fontSize:22,fontWeight:700}}>Admin Panel</div>
        <div style={{color:C.muted,fontSize:13,marginTop:4}}>Manage portfolio data without code</div>
      </div>

      {msg && (
        <div style={{background:msgType==="ok"?C.green+"18":C.red+"18",border:`1px solid ${msgType==="ok"?C.green:C.red}35`,borderRadius:12,padding:"12px 16px",marginBottom:16,color:msgType==="ok"?C.green:C.red,fontSize:13,fontWeight:600}}>
          {msg}
        </div>
      )}

      {/* Upload Stocks */}
      <div style={{background:C.card,border:`1px solid ${C.border}`,borderRadius:18,padding:"20px",marginBottom:16,boxShadow:cs}}>
        <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:6}}>
          <span style={{fontSize:18}}>📁</span>
          <span style={{color:C.text,fontSize:15,fontWeight:700}}>Upload Stock List</span>
        </div>
        <div style={{color:C.muted,fontSize:12,marginBottom:14,lineHeight:1.6}}>
          Upload a <strong>CSV file</strong> exported from Excel. Columns: <span style={{fontFamily:"DM Mono,monospace",fontSize:11,color:C.accent}}>Ticker, Exchange, Price, Qty, Invested, Div</span>. New stocks are added, existing ones are updated.
        </div>
        <input ref={fileRef} type="file" accept=".csv,.txt" onChange={handleFile} style={{display:"none"}}/>
        <button onClick={()=>fileRef.current.click()} style={{width:"100%",padding:"14px",borderRadius:12,background:`linear-gradient(135deg,${C.accent},${C.accent}CC)`,border:"none",color:"#fff",fontSize:14,fontWeight:700,cursor:"pointer",boxShadow:`0 4px 16px ${C.accent}30`}}>
          📂 Choose CSV File
        </button>
        <div style={{color:C.muted,fontSize:11,marginTop:10,textAlign:"center"}}>
          Current database: <strong style={{color:C.accent}}>{stocks.length} stocks</strong>
        </div>
      </div>

      {/* Edit Stats */}
      <div style={{background:C.card,border:`1px solid ${C.border}`,borderRadius:18,padding:"20px",marginBottom:16,boxShadow:cs}}>
        <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:14}}>
          <span style={{fontSize:18}}>✏️</span>
          <span style={{color:C.text,fontSize:15,fontWeight:700}}>Update Portfolio Stats</span>
        </div>
        {fields.map(f => (
          <div key={f.key} style={{marginBottom:12}}>
            <div style={{color:C.muted,fontSize:11,letterSpacing:0.7,textTransform:"uppercase",marginBottom:5}}>{f.label}</div>
            <input
              type={f.type}
              value={editStats[f.key]}
              onChange={e => setEditStats(s => ({...s, [f.key]: e.target.value}))}
              style={{width:"100%",padding:"10px 14px",borderRadius:10,border:`1.5px solid ${C.border}`,background:C.bg,color:C.text,fontSize:14,fontFamily:"DM Mono,monospace",outline:"none",transition:"border-color 0.2s"}}
              onFocus={e => e.target.style.borderColor=C.accent}
              onBlur={e => e.target.style.borderColor=C.border}
            />
          </div>
        ))}
        <button onClick={saveStats} style={{width:"100%",padding:"13px",borderRadius:12,background:`linear-gradient(135deg,${C.green},${C.green}CC)`,border:"none",color:"#fff",fontSize:14,fontWeight:700,cursor:"pointer",marginTop:4,boxShadow:`0 4px 16px ${C.green}30`}}>
          💾 Save Stats
        </button>
      </div>

      {/* Export + Reset */}
      <div style={{background:C.card,border:`1px solid ${C.border}`,borderRadius:18,padding:"20px",marginBottom:16,boxShadow:cs}}>
        <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:14}}>
          <span style={{fontSize:18}}>🔧</span>
          <span style={{color:C.text,fontSize:15,fontWeight:700}}>Tools</span>
        </div>
        <button onClick={exportCSV} style={{width:"100%",padding:"13px",borderRadius:12,background:C.gold+"18",border:`1px solid ${C.gold}40`,color:C.gold,fontSize:14,fontWeight:700,cursor:"pointer",marginBottom:10}}>
          📤 Export Portfolio as CSV
        </button>
        <button onClick={resetToDefault} style={{width:"100%",padding:"13px",borderRadius:12,background:C.red+"12",border:`1px solid ${C.red}30`,color:C.red,fontSize:14,fontWeight:600,cursor:"pointer"}}>
          🔄 Reset to Default Data

      <SocialBar/>

  );

  });
  const [stocks, setStocks] = useState(() => {
    try { const s = localStorage.getItem("asf_stocks"); return s ? JSON.parse(s) : RAW; } catch(e) { return RAW; }
  });

  const tabs = [
    () => <HomeTab stats={stats}/>,
    () => <PortfolioTab stocks={stocks}/>,
    () => <VoteTab/>,
    () => <InvestTab/>,
    () => <ProfileTab/>,
    () => <AdminTab stats={stats} setStats={setStats} stocks={stocks} setStocks={setStocks}/>,
  ];
  const ActiveComponent = tabs[activeTab];

  return (
    <div style={{background:C.bg,minHeight:"100vh",maxWidth:430,margin:"0 auto",fontFamily:"'DM Sans',sans-serif",color:C.text}}>
      <style>{`
        
        *{box-sizing:border-box;margin:0;padding:0;}
        ::-webkit-scrollbar{display:none;}
        @keyframes pulse{0%,100%{opacity:1}50%{opacity:0.4}}
        @keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
        button{transition:opacity 0.15s,transform 0.15s;}
        button:active{opacity:0.8;transform:scale(0.97);}
        input{transition:border-color 0.2s;}
        input:focus{outline:none;}
        input[type=number]::-webkit-outer-spin-button,
        input[type=number]::-webkit-inner-spin-button{-webkit-appearance:none;margin:0;}
      `}</style>

      {/* HEADER */}
      <div style={{padding:"14px 16px",borderBottom:`1px solid ${C.border}`,display:"flex",alignItems:"center",justifyContent:"space-between",background:C.bg,position:"sticky",top:0,zIndex:100}} data-header>
        <div style={{display:"flex",alignItems:"center",gap:10}}>
          <div style={{width:32,height:32,borderRadius:9,background:`linear-gradient(135deg,${C.accent},${C.green})`,display:"flex",alignItems:"center",justifyContent:"center",fontSize:14,fontWeight:800,color:"#fff"}}>◈</div>
          <div>
            <div style={{color:C.text,fontSize:15,fontWeight:700,lineHeight:1}}>All Stock Fund</div>
            <div style={{color:C.muted,fontSize:9,letterSpacing:1.5,textTransform:"uppercase"}}>Community Owned · Global</div>
          </div>
        </div>
        <div style={{background:C.green+"20",border:`1px solid ${C.green}35`,borderRadius:8,padding:"4px 10px",display:"flex",alignItems:"center",gap:5}}>
          <GlowDot color={C.green}/>
          <span style={{color:C.green,fontSize:10,fontWeight:600}}>LIVE</span>
        </div>
      </div>

      {/* CONTENT */}
      <div style={{paddingTop:16,animation:"fadeIn 0.3s ease"}}>
        <ActiveComponent/>
      </div>

      {/* BOTTOM NAV */}
      <div style={{position:"fixed",bottom:0,left:"50%",transform:"translateX(-50%)",width:"100%",maxWidth:430,background:C.navBg,backdropFilter:"blur(20px)",borderTop:`1px solid ${C.border}`,display:"flex",padding:"8px 0 20px",zIndex:200}}>
        {TABS.map((tab,i) => (
          <button key={tab} onClick={()=>setActiveTab(i)} style={{flex:1,display:"flex",flexDirection:"column",alignItems:"center",gap:4,padding:"6px 0",background:"transparent",border:"none",cursor:"pointer",position:"relative"}}>
            <span style={{fontSize:i===3?20:18,color:activeTab===i?C.accent:C.muted,filter:activeTab===i?`drop-shadow(0 0 5px ${C.accent})`:"none",transition:"color 0.2s,filter 0.2s"}}>{TAB_ICONS[i]}</span>
            <span style={{fontSize:10,color:activeTab===i?C.accent:C.muted,fontWeight:activeTab===i?600:400,letterSpacing:0.5}}>{tab}</span>
            {activeTab===i&&<div style={{position:"absolute",bottom:-4,width:20,height:2,background:C.accent,borderRadius:2,boxShadow:`0 0 8px ${C.accent}`}}/>}
          </button>
        ))}
      </div>
    </div>
  );
}


const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(React.createElement(App));
  </script>
</body>
</html>
